<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英语衡水体字帖生成器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-copy">
      <h1>英语衡水体字帖生成器</h1>
    <p>输入英语作文，实时生成 A4 英语字帖</p>
    </div>
    <div class="header-actions">
      <span id="font-status" class="font-status">字体：正在加载……</span>
      <span class="version">v1.1.0</span>
      <button id="print-button" type="button" class="primary">打印 / 保存 PDF</button>
    </div>
  </header>

  <main class="app-layout">
    <aside class="editor-panel">
      <label for="essay-input">英语作文</label>
      <textarea id="essay-input" placeholder="在这里粘贴英语作文……"></textarea>
      <div class="stats"><span id="char-count">字符数：0</span><span id="word-count">单词数：0</span></div>
      <div class="input-actions">
        <button id="example-button" type="button">填入示例</button>
        <button id="clear-button" type="button">清空</button>
      </div>

      <fieldset>
        <legend>字帖模式</legend>
        <label><input type="radio" name="mode" value="copy" checked> 抄写</label>
        <label><input type="radio" name="mode" value="trace"> 临摹</label>
        <label><input type="radio" name="mode" value="outline"> 描红</label>
      </fieldset>

      <details class="advanced-settings">
        <summary>高级设置</summary>
        <div class="setting-group">
          <h2>文字</h2>
          <label for="font-size">字体大小 <output id="font-size-value" for="font-size">28px</output></label>
          <input id="font-size" name="font-size" type="range" min="18" max="40" step="1" value="28">
          <label for="font-color">字体颜色</label>
          <input id="font-color" name="font-color" type="color" value="#000000">
        </div>
        <div class="setting-group">
          <h2>横线与行距</h2>
          <label for="line-height">行距 <output id="line-height-value" for="line-height">9mm</output></label>
          <input id="line-height" name="line-height" type="range" min="6" max="14" step="0.5" value="9">
          <label for="line-width">横线粗细 <output id="line-width-value" for="line-width">1px</output></label>
          <input id="line-width" name="line-width" type="range" min="0.5" max="3" step="0.5" value="1">
          <label for="line-color">横线颜色</label>
          <input id="line-color" name="line-color" type="color" value="#000000">
          <label class="checkbox-label"><input id="show-lines" name="show-lines" type="checkbox" checked> 显示横线</label>
        </div>
      </details>

    </aside>

    <section class="preview-container" aria-label="字帖预览">
      <div id="preview-pages"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
